include:
  - project: myrole/ci-templates
    ref: v1
    file: /buildkit.yml
  - project: myrole/ci-templates
    ref: v1
    file: /deploy.yml

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

build:
  extends: .default-build
  script:
    - |
      $BUILDCTL build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --output "type=image,\"name=${CI_REGISTRY_IMAGE}:sha-${CI_COMMIT_SHORT_SHA},${CI_REGISTRY_IMAGE}:latest\",push=true"

deploy:
  extends: .default-deploy
  needs:
    - build
  variables:
    DEPLOY_WEBHOOK_URL: "$PORTAINER_WEBHOOK_URL"
    DEPLOY_WEBHOOK_SECRET: "$PORTAINER_WEBHOOK_SECRET"
  rules:
    - if: '$PORTAINER_WEBHOOK_URL'
