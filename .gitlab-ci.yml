include:
  - project: myrole/ci-templates
    ref: v1
    file: /buildkit.yml
  - project: myrole/ci-templates
    ref: v1
    file: /deploy.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "staging") && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

stages:
  - test
  - build
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

checks:
  stage: test
  image: node:24-bookworm-slim
  timeout: 25m
  services:
    - name: postgres:17-alpine
      alias: db
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
  variables:
    POSTGRES_USER: mailer_demo
    POSTGRES_PASSWORD: mailer_demo
    POSTGRES_DB: mailer_support
    DATABASE_URL: postgresql://mailer_demo:mailer_demo@db:5432/mailer_support
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm
    paths:
      - .pnpm-store/
  before_script:
    - npm install --global pnpm@10.31.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm build
    # The PostgreSQL service replaces the Docker Compose step in pnpm test.
    - node --test src/lib/mailbox.test.ts api/dist/api/app.test.js api/dist/api/mail-secrets.test.js

build:
  extends: .default-build
  timeout: 40m
  variables:
    TAGS: "${CI_REGISTRY_IMAGE}:commit-${CI_COMMIT_SHA},${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        TAGS: "${CI_REGISTRY_IMAGE}:commit-${CI_COMMIT_SHA},${CI_REGISTRY_IMAGE}:staging"
    - when: never
  script:
    - |
      $BUILDCTL build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --output type=image,\"name=${TAGS}\",push=true

deploy:
  extends: .default-deploy
  variables:
    DEPLOY_WEBHOOK_URL: "$PORTAINER_WEBHOOK_URL"
    DEPLOY_WEBHOOK_SECRET: "$PORTAINER_WEBHOOK_SECRET"
  rules:
    - if: '!$PORTAINER_WEBHOOK_URL'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

deploy-staging:
  extends: .default-deploy
  variables:
    DEPLOY_ENVIRONMENT: staging
    DEPLOY_WEBHOOK_URL: "$PORTAINER_STAGING_WEBHOOK_URL"
    DEPLOY_WEBHOOK_SECRET: "$PORTAINER_STAGING_WEBHOOK_SECRET"
  rules:
    - if: '!$PORTAINER_STAGING_WEBHOOK_URL'
      when: never
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - when: never
