name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postfold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, integration tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install integration browser
        run: |
          npm install --global agent-browser@0.33.2
          test -x "$AGENT_BROWSER_EXECUTABLE_PATH"
      - name: Real IMAP and SMTP integration
        run: node scripts/check-live-mail.mjs
        env:
          MAIL_TEST_WEB: 'true'
          MAIL_TEST_BROWSER: 'true'
      - name: Keycloak SSO and shared assignment integration
        run: node scripts/check-keycloak.mjs
      - name: Rich authoring and team management integration
        run: node scripts/check-authoring.mjs
      - name: Responsive viewport and multi-contact conversation integration
        env:
          DEMO_MODE: 'true'
          MAILBOX_MODE: demo
          POSTFOLD_AUTH: basic
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: '3002'
        run: |
          node api/dist/api/main.js > "$RUNNER_TEMP/postfold-api.log" 2>&1 &
          postfold_api_pid=$!
          node .output/server/index.mjs > "$RUNNER_TEMP/postfold-web.log" 2>&1 &
          postfold_web_pid=$!
          trap 'kill "$postfold_web_pid" "$postfold_api_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/demo/mailbox > /dev/null && curl --fail --silent 'http://127.0.0.1:3002/?lang=en' > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/demo/mailbox > /dev/null
          node scripts/check-viewport.mjs
      - name: Build and verify the deployment image
        run: |
          docker build --tag postfold:check .
          node scripts/check-container.mjs
      - name: Package compiled runtime
        run: tar -czf "$RUNNER_TEMP/postfold-runtime.tar.gz" .output api/dist package.json pnpm-lock.yaml LICENSE README.md .env.example docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postfold-runtime
          path: ${{ runner.temp }}/postfold-runtime.tar.gz
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Public images and release assets
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postfold-runtime
          path: release
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set registry image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          cache-from: type=gha,scope=postfold
          cache-to: type=gha,mode=max,scope=postfold
      - name: Record image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE@$DIGEST" > release/image.txt
          echo "Published image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish versioned downloads
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" "postfold:${GITHUB_REF_NAME#v}"
            docker image save --platform "linux/$arch" "postfold:${GITHUB_REF_NAME#v}" | gzip > "release/postfold-linux-$arch.tar.gz"
            # Classic Docker storage cannot keep both architectures under one index digest.
            docker image rm "$IMAGE@$DIGEST" "postfold:${GITHUB_REF_NAME#v}"
          done
          tar -czf release/postfold-deploy.tar.gz deploy docs LICENSE
          (cd release && sha256sum ./*.tar.gz image.txt > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}" release/*
          fi
